name: Update profile cards

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards
        run: node scripts/update-profile-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: MatsumotoMorami

      - name: Commit cards
        run: |
          if ! git diff --quiet -- assets/github-stats.svg assets/top-langs.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-stats.svg assets/top-langs.svg
            git commit -m "Update profile cards [skip ci]"
            git push
          fi
