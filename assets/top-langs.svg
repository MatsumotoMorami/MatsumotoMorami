<svg width="520" height="260" viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>GitHub profile card</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  
    <rect width="520" height="260" rx="20" fill="#fff7fb" stroke="#f3b6cf" stroke-width="2"/>
    <text x="28" y="42" fill="#40333d" font-size="24" font-weight="700">Top Languages</text>
    <text x="28" y="66" fill="#8d687c" font-size="14">calculated from public non-fork repositories</text>
    <rect x="28" y="78" width="464" height="14" rx="7" fill="#f8dce9"/>
    <rect x="28" y="78" width="367" height="14" rx="7" fill="#f34b7d"/><rect x="395" y="78" width="36" height="14" rx="7" fill="#3178c6"/><rect x="431" y="78" width="24" height="14" rx="7" fill="#dea584"/><rect x="455" y="78" width="16" height="14" rx="7" fill="#3572A5"/><rect x="471" y="78" width="10" height="14" rx="7" fill="#427819"/><rect x="481" y="78" width="10" height="14" rx="7" fill="#f1e05a"/>
    
      <circle cx="34" cy="120" r="5" fill="#f34b7d"/>
      <text x="48" y="124" fill="#40333d" font-size="14">C++</text>
      <text x="454" y="124" fill="#8d687c" font-size="13" text-anchor="end">79.1%</text>
    
      <circle cx="34" cy="142" r="5" fill="#3178c6"/>
      <text x="48" y="146" fill="#40333d" font-size="14">TypeScript</text>
      <text x="454" y="146" fill="#8d687c" font-size="13" text-anchor="end">7.9%</text>
    
      <circle cx="34" cy="164" r="5" fill="#dea584"/>
      <text x="48" y="168" fill="#40333d" font-size="14">Rust</text>
      <text x="454" y="168" fill="#8d687c" font-size="13" text-anchor="end">5.2%</text>
    
      <circle cx="34" cy="186" r="5" fill="#3572A5"/>
      <text x="48" y="190" fill="#40333d" font-size="14">Python</text>
      <text x="454" y="190" fill="#8d687c" font-size="13" text-anchor="end">3.5%</text>
    
      <circle cx="34" cy="208" r="5" fill="#427819"/>
      <text x="48" y="212" fill="#40333d" font-size="14">Makefile</text>
      <text x="454" y="212" fill="#8d687c" font-size="13" text-anchor="end">2.2%</text>
    
      <circle cx="34" cy="230" r="5" fill="#f1e05a"/>
      <text x="48" y="234" fill="#40333d" font-size="14">JavaScript</text>
      <text x="454" y="234" fill="#8d687c" font-size="13" text-anchor="end">2.1%</text>
    
  
