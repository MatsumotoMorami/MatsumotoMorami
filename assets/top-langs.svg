    <rect x="28" y="78" width="388" height="14" rx="7" fill="#f34b7d"/><rect x="416" y="78" width="38" height="14" rx="7" fill="#3178c6"/><rect x="454" y="78" width="11" height="14" rx="7" fill="#427819"/><rect x="465" y="78" width="10" height="14" rx="7" fill="#3572A5"/><rect x="475" y="78" width="9" height="14" rx="7" fill="#41b883"/><rect x="484" y="78" width="8" height="14" rx="7" fill="#555555"/>
    
      <circle cx="34" cy="120" r="5" fill="#f34b7d"/>
