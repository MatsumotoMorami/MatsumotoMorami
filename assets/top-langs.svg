<svg width="520" height="260" viewBox="0 0 520 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>GitHub profile card</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  
    <rect width="520" height="260" rx="20" fill="#fff7fb" stroke="#f3b6cf" stroke-width="2"/>
    <text x="28" y="42" fill="#40333d" font-size="24" font-weight="700">Top Languages</text>
    <text x="28" y="66" fill="#8d687c" font-size="14">calculated from public non-fork repositories</text>
    <rect x="28" y="78" width="464" height="14" rx="7" fill="#f8dce9"/>
    <rect x="28" y="78" width="162" height="14" rx="7" fill="#3178c6"/><rect x="190" y="78" width="102" height="14" rx="7" fill="#00b4ab"/><rect x="292" y="78" width="93" height="14" rx="7" fill="#dea584"/><rect x="385" y="78" width="70" height="14" rx="7" fill="#f1e05a"/><rect x="455" y="78" width="37" height="14" rx="7" fill="#41b883"/>
    
      <circle cx="34" cy="120" r="5" fill="#3178c6"/>
      <text x="48" y="124" fill="#40333d" font-size="14">TypeScript</text>
      <text x="454" y="124" fill="#8d687c" font-size="13" text-anchor="end">35%</text>
    
      <circle cx="34" cy="142" r="5" fill="#00b4ab"/>
      <text x="48" y="146" fill="#40333d" font-size="14">Dart</text>
      <text x="454" y="146" fill="#8d687c" font-size="13" text-anchor="end">22%</text>
    
      <circle cx="34" cy="164" r="5" fill="#dea584"/>
      <text x="48" y="168" fill="#40333d" font-size="14">Rust</text>
      <text x="454" y="168" fill="#8d687c" font-size="13" text-anchor="end">20%</text>
    
      <circle cx="34" cy="186" r="5" fill="#f1e05a"/>
      <text x="48" y="190" fill="#40333d" font-size="14">JavaScript</text>
      <text x="454" y="190" fill="#8d687c" font-size="13" text-anchor="end">15%</text>
    
      <circle cx="34" cy="208" r="5" fill="#41b883"/>
      <text x="48" y="212" fill="#40333d" font-size="14">Vue</text>
      <text x="454" y="212" fill="#8d687c" font-size="13" text-anchor="end">8%</text>
    
  
</svg>
